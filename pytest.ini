[pytest]
# Scope collection to the maintained suite.
#
# Without this, running a bare `pytest` from the repository root also collects
# the ad-hoc hardware probes that sit in the root directory (test_ioptron.py,
# test_v4l2.py and friends). Those import cv2 and need a physical device
# attached, so a fresh clone would report four collection *errors* before any
# real test ran -- which reads as "this project's tests are broken" to anyone
# seeing it for the first time. They are exploratory scripts kept for their
# findings, not part of the suite; the gate invokes tests/ explicitly and is
# unaffected by this setting.
testpaths = tests

# The suite is offline-safe by design: it may bind loopback and monkeypatch
# sockets, but must never require the Polaris. Hardware-dependent checks are kept
# out of pytest entirely and live as scripts under scripts/ instead, so nothing
# here needs custom markers yet. --strict-markers means adding one later requires
# registering it in this file rather than silently misspelling it into a no-op.
addopts = -q --strict-markers
